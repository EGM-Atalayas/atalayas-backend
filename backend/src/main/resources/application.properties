spring.application.name=backend

server.port=${PORT:8080}
# Conexion a Neon.tech (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuracion de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# JWT
app.jwt.secret=${JWT_SECRET:atalayas-local-dev-secret-key-must-be-at-least-32-characters-long}
# Cookies JWT
# En produccion (HTTPS) cambiar a true
app.cookie.secure=${COOKIE_SECURE:false}
# CORS - Origenes permitidos (frontend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Deshabilitar el default petURL de Swagger para evitar exposicion accidental
springdoc.swagger-ui.disable-swagger-default-url=true
# Ordenar tags alfabeticamente en la UI
springdoc.swagger-ui.tags-sorter=alpha
# Ordenar operaciones por metodo HTTP
springdoc.swagger-ui.operations-sorter=method
# URL publica del servidor — usada por Swagger para el "Try it out"
# En Railway configurar: SERVER_URL=https://atalayas-backend-production-4777.up.railway.app
app.server.url=${SERVER_URL:http://localhost:8080}

# ── Correo electrónico (SMTP Gmail) ──────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Remitente que aparece en el "From:"
app.mail.from=${MAIL_USER}
# URL del frontend para generar enlaces en los emails
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Rutas inexistentes ? 404 limpio via GlobalExceptionHandler (evita 500 del fallback /error)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.validation-timeout=5000
# Con REQUIRES_NEW el audit abre una 2ª conexión mientras la transacción exterior
# sigue activa (envío de email + notificación puede tardar varios segundos).
# 30 s es un umbral conservador que elimina falsos positivos sin enmascarar leaks reales.
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=30

# ── Google Gemini ─────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.model=gemini-1.5-flash
gemini.max-tokens=8192

# ── Subida de archivos (multipart) ────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Directorio de uploads (avatares, etc.) ─────────────────────────────────────
# Relativo al directorio de ejecución del proceso; en producción sobreescribir
# con la variable de entorno UPLOAD_DIR apuntando a un volumen persistente.
app.upload.dir=${UPLOAD_DIR:uploads}