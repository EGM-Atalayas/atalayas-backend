spring.application.name=backend

server.port=${PORT:8080}
# Conexion a Neon.tech (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuracion de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# JWT
app.jwt.secret=${JWT_SECRET}
# Cookies JWT
# En produccion (HTTPS) cambiar a true
app.cookie.secure=${COOKIE_SECURE}
# CORS - Origenes permitidos (frontend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Deshabilitar el default petURL de Swagger para evitar exposicion accidental
springdoc.swagger-ui.disable-swagger-default-url=true

# ?? Correo electronico (SMTP) ????????????????????????????????????????????????
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Remitente que aparece en el "From:"
app.mail.from=${MAIL_USER}



