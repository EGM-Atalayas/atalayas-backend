# ?? Perfil de test: H2 en memoria (no requiere PostgreSQL/Supabase) ??????????????
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Crear y destruir el esquema en cada ejecuci?n de tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT: secreto fijo de test (m?nimo 32 caracteres para HS256)
app.jwt.secret=test-jwt-secret-key-for-testing-only-minimum32chars!

# Cookies no seguras en tests (no hay HTTPS)
app.cookie.secure=false

# CORS: no relevante en tests
cors.allowed-origins=http://localhost:3000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

